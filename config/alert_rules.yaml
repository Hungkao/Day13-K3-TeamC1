alerts:
  - name: HighLatencyP95
    severity: Critical
    condition: P95 latency > 3000ms over 2m window
    type: symptom-based
    owner: Hung (Metrics & Alerting)
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: Critical
    condition: Error rate > 2% over 3m window
    type: symptom-based
    owner: Hung (Metrics & Alerting)
    runbook: docs/alerts.md#alert-2
  - name: HighCostBurnRate
    severity: Warning
    condition: Total cost > $2.5 USD over 60m window
    type: symptom-based
    owner: Hung (Metrics & Alerting)
    runbook: docs/alerts.md#alert-3

